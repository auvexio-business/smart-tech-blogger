name: Daily Blogger publishing

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            "https://smart-tech-blogger.onrender.com/api/automation/run"
