name: Daily Blogger publishing

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily article
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          test -n "$AUTOMATION_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $AUTOMATION_SECRET" \
            -H "Content-Type: application/json" \
            "https://smart-tech-blogger.onrender.com/api/automation/run"
